<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>StockTrackr — Sale Transactions</title>
    <link rel="stylesheet" href="css/styles.css"> 
</head>
<body>
<div class="app">
    <header class="topbar">
        <div style="display:flex; align-items:center;">
            <div class="brand">
                <a href="index.html">
                    <div class="logo">
                        <img src="assets/logo.png" alt="StockTrackr logo" width="46" height="46">
                    </div>
                </a>
                <div>
                    <div style="font-weight:800; font-size:18px; letter-spacing:-0.2px;">Stock<span style="color:#F6A800">Trackr</span></div>
                </div>
            </div>
            <nav class="navlinks">
                <a href="index.html">Dashboard</a>
                <a href="query1.html" aria-current="page">Transactions</a>
                <a href="query2.html">Inventory</a>
                <a href="query3.html">Above Average</a>
                <a href="query4.html">Purchase Quantities</a>
                <a href="query5.html">Contact List</a>
                <a href="query6.html">Fund Transfer</a>
            </nav>
        </div>
        <div class="right-actions">
            <button class="btn ghost">Manager</button>
            <button class="btn">Logout</button>
        </div>
    </header>

    <main class="main">
        <div class="title">
            <h1>Sale Transaction Details</h1>
            <p class="subtitle">View comprehensive sales transaction audit (8-table JOIN)</p>
        </div>

        <div class="card">
            <form action="/query1" method="GET">
                <div class="form-group">
                    <label for="limit">Number of Transactions to Display</label>
                    <input type="number" id="limit" name="limit" value="20" min="1" max="100" required>
                    <small style="color:#666; font-size:13px;">Shows the most recent transactions (max 100)</small>
                </div>
                
                <button type="submit" class="btn-primary">View Transactions</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
