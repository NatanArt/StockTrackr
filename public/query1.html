<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>StockTrackr — Order Search</title>
    <link rel="stylesheet" href="css/styles.css"> 
</head>
<body>
<div class="app">
    <header class="topbar">
        <div style="display:flex; align-items:center;">
            <div class="brand">
                <a href="index.html">
                    <div class="logo">
                        <img src="assets/logo.png" alt="StockTrackr logo" width="46" height="46">
                    </div>
                </a>
                <div>
                    <div style="font-weight:800; font-size:18px; letter-spacing:-0.2px;">Stock<span style="color:#F6A800">Trackr</span></div>
                </div>
            </div>
            <nav class="navlinks">
                <a href="index.html">Dashboard</a>
                <a href="query1.html" aria-current="page">Orders</a>
                <a href="query2.html">Categories</a>
                <a href="query6.html">Transactions</a>
            </nav>
        </div>
        <div class="right-actions">
            <button class="btn ghost">Manager</button>
            <button class="btn">Logout</button>
        </div>
    </header>

    <main class="main">
        <div class="title">
            <h1>Search Orders</h1>
            <p class="subtitle">View complete order information with line items</p>
        </div>

        <div class="card">
            <form action="/query1" method="GET">
                <div class="form-group">
                    <label for="orderType">Order Type</label>
                    <select id="orderType" name="orderType" required>
                        <option value="Purchase">Purchase Orders (from suppliers)</option>
                        <option value="Sale">Sales Orders (to customers)</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-primary">View Orders</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
